<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Грузим чашечки</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #2c2c2c;
    font-family: Georgia, serif;
    color: #e8e0d6;
  }
  .container {
    text-align: center;
    width: 340px;
  }
  .cup-wrapper {
    display: flex;
    justify-content: center;
  }
  .cup-wrapper svg {
    width: 260px;
    height: 180px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.4));
  }
  h1 {
    font-size: 1.1rem;
    font-weight: normal;
    letter-spacing: .05em;
    margin-bottom: 18px;
    opacity: .85;
  }
  .bar-track {
    width: 100%;
    height: 10px;
    background: #444;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 20px;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #c9b99a, #f5efe6);
    border-radius: 5px;
    transition: width .3s ease;
  }
  .percent {
    margin-top: 10px;
    font-size: .95rem;
    font-variant-numeric: tabular-nums;
    opacity: .7;
  }
  .done-msg {
    display: none;
    margin-top: 14px;
    font-size: 1rem;
    color: #c9b99a;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Грузим чашечки&hellip;</h1>

  <div class="cup-wrapper">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300">
    <style>
        :root { --sine: cubic-bezier(0.37, 0, 0.63, 1); }
        .logo {
            background: grey
        }
        .porcelain {
            fill: white
        }

        #handle-x {
          animation: hx 2s var(--sine) infinite alternate;
        }
        @keyframes hx {
          from { transform: translateX(0px); }
          to   { transform: translateX(380px); }
        }

        #handle-y {
          animation: hy 2s var(--sine) -1s infinite alternate;
        }
        @keyframes hy {
          from { transform: translateY(-15px); }
          to   { transform: translateY(15px); }
        }

        #handle-shape {
          transform-box: fill-box;
          transform-origin: 0% 50%;
          animation: hs 2s var(--sine) infinite alternate;
        }
        @keyframes hs {
          from { transform: scaleX(1); }
          to   { transform: scaleX(-1); }
        }

        #cup-silhouette {
          animation: hide-behind 4s step-end infinite;
        }
        @keyframes hide-behind {
          0%   { opacity: 0; }  /* передняя половина: ручка видна целиком */
          50%  { opacity: 1; }  /* задняя половина: корпус прячет ручку */
          100% { opacity: 0; }
        }

        #handle-edge {
          animation: edge-fade 2s infinite;
        }
        @keyframes edge-fade {
          0%, 40%  { opacity: 0; }
          45%, 55% { opacity: 1; }
          60%, 100%{ opacity: 0; }
        }

        #pattern-strip {
          animation: spin-pattern 4s linear infinite;
        }
        @keyframes spin-pattern {
          from { transform: translateX(0); }
          to   { transform: translateX(377px); }
        }


    </style>

</div>

<script>
  const fill = document.getElementById('fill');
  const pct  = document.getElementById('pct');
  const done = document.getElementById('done');
  const h1   = document.querySelector('h1');
  let progress = 0;

  const iv = setInterval(() => {
    progress += Math.random() * 3 + 0.5;
    if (progress >= 100) {
      progress = 100;
      clearInterval(iv);
      h1.textContent = 'Готово!';
      done.style.display = 'block';
    }
    fill.style.width = progress + '%';
    pct.textContent  = Math.floor(progress) + ' %';
  }, 200);
</script>
