<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Грузим чашечки</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #2c2c2c;
    font-family: Georgia, serif;
    color: #e8e0d6;
  }
  .container {
    text-align: center;
    width: 340px;
  }
  .cup-wrapper {
    display: flex;
    justify-content: center;
  }
  .cup-wrapper svg {
    width: 260px;
    height: 180px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.4));
  }
  h1 {
    font-size: 1.1rem;
    font-weight: normal;
    letter-spacing: .05em;
    margin-bottom: 18px;
    opacity: .85;
  }
  .bar-track {
    width: 100%;
    height: 10px;
    background: #444;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 20px;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #c9b99a, #f5efe6);
    border-radius: 5px;
    transition: width .3s ease;
  }
  .percent {
    margin-top: 10px;
    font-size: .95rem;
    font-variant-numeric: tabular-nums;
    opacity: .7;
  }
  .done-msg {
    display: none;
    margin-top: 14px;
    font-size: 1rem;
    color: #c9b99a;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Грузим чашечки&hellip;</h1>

  <div class="cup-wrapper">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300">
        <style>
            :root { --sine: cubic-bezier(0.37, 0, 0.63, 1); }
            .logo {
                background: grey
            }
            .porcelain {
                fill: white
            }

            #handle-x {
                animation: hx 2s var(--sine) infinite alternate;
            }
            @keyframes hx {
                from { transform: translateX(0px); }
                to   { transform: translateX(380px); }
            }

            #handle-y {
                animation: hy 2s var(--sine) -1s infinite alternate;
            }
            @keyframes hy {
                from { transform: translateY(-15px); }
                to   { transform: translateY(15px); }
            }

            #handle-shape {
                transform-box: fill-box;
                transform-origin: 0% 50%;
                animation: hs 2s var(--sine) infinite alternate;
            }
            @keyframes hs {
                from { transform: scaleX(1); }
                to   { transform: scaleX(-1); }
            }

            #cup-silhouette {
                animation: hide-behind 4s step-end infinite;
            }
            @keyframes hide-behind {
                0%   { opacity: 0; }
                50%  { opacity: 1; }
                100% { opacity: 0; }
            }

            #handle-edge {
                animation: edge-fade 2s infinite;
            }
            @keyframes edge-fade {
                0%, 40%  { opacity: 0; }
                45%, 55% { opacity: 1; }
                60%, 100%{ opacity: 0; }
            }

            #pattern-strip {
                animation: spin-pattern 8s linear infinite;
            }
            @keyframes spin-pattern {
                from { transform: translateX(0); }
                to   { transform: translateX(1508px); }
            }
        </style>

        <defs>
            <symbol id="isaac" viewBox="0 0 100 100">

                    <g id="dome">

                        <rect id="dome-crossbar" height="0.6" width="25.6" x="37.7" y="43.6"/>
                        <rect id="dome-bottom-portico" height="0.6" width="21" x="40" y="39"/>
                        <rect id="dome-top-portico" height="0.6" width="19.6" x="40.5" y="32.8"/>
                    </g>
                    <g id="colonade">
                        <rect id="column" height="11" width="0.2" x="37.2" y="44.5"/>
                        <use href="#column" x="6.5"/>
                        <use href="#column" x="13"/>
                        <use href="#column" x="19.5"/>

                    </g>

                    <g id="wing">

                        <path id="window" d="M 17.8 94.3 L 14.2 94.3 L 14.2 86.3 C 14.2 85.1 15 84.1 16 84.1 C 17 84.1 17.8 85.1 17.8 86.3 L 17.8 94.3" />

                    <rect id="wing-wall" height="18.9" width="6.2" x="4" y="80"/>

                    <g id="statue">

                    </g>

                    <use href="#wing" x="68.3" />

                    <use href="#wing-second" x="69.6" />
                    <use href="#wing-third" x="68" />
                    <use href="#angel" transform="translate(100) scale(-1 1)" />

                    <g id="belfry">
                        <rect id="belfry-body" height="10" width="9" x="22.7" y="50.2"/>
                        <path id="belfry-portico" d="M 23 49.5 L 23 48.5 C 23 48.4 23.1 48.3 23.2 48.2 L 27.1 45.9 L 27.4 45.9 L 31.3 48.2 C 31.4 48.3 31.5 48.4 31.5 48.5 L 31.5 49.5 Z"/>
                        <path id="belfry-dome" d="M 24.4 46.3 C 24.4 43.9 25.8 42.3 27.4 42.3 C 29 42.3 30.3 43.9 30.3 46.3Z"/>
                        <rect id="belfry-spire" height="6" width="0.3" x="27.3" y="36.3" />

                    </g>
                    <use href="#belfry" x="46.4" />
                    <g id="portico">
                        <path d="M 73.8 70.8 L 27 70.8 L 27 68.7 L 50.3 58.5 L 50.5 58.5 L 50.5 58.5 L 73.8 68.8 L 73.8 70.8"/>
                    </g>
                </g>
            </symbol>
            <symbol id="bronze-horseman" viewBox="0 0 100 100">

                    <path id="bh-hoof" d="M 37 30 Q 37 33 34 35 Q 30 35 26 33 Q 24 37 25 41"/>
                    <path id="bh-Peter" d="M 41 13 Q 38 20 43 25 L 48 29 L 56 35" />
                    <path id="bh-stone" d="M 40 64 L 50 64 Q 53 64 54 65 L 71 76"/>
                    <path id="bh-stone_edge" d="M 18 68 L 21 84 Q 34 83 34 93"/>
                    <path id="bh-stone-text" d="M 45 77 L 60 78 M 39 81 L 64 82 M 47 85 L 58 85.5" />
                    <path id="bh-horse-knee" d="M 52 54 L 50 50 Q 49 48 54 45"/>
                    <path id="bh-hole1" d="M 66 72 L 61 56 Q 61 55 59 54 Q 59 59 61 61 L 58 67"/>
                    <path id="bh-hole2" d="M 47.2 64.6 C 51.2 62.6 49.7 61.6 47.7 58.6 V 56 L 52.2 54.6 C 54.2 57.8 56.4 59.2 57.2 59.6 V 63 L 55.7 66.6 C 51.3 64.2 48.2 64.2 47.2 64.6 Z"/>
                </g>
            </symbol>

            <linearGradient id="edge-fade">
                <stop offset="0"    stop-color="black"/>
                <stop offset="0.3"  stop-color="white"/>
                <stop offset="0.7"  stop-color="white"/>
                <stop offset="1"    stop-color="black"/>
            </linearGradient>

            <mask id="on-cup" maskUnits="userSpaceOnUse"
                  x="0" y="0" width="380" height="300">
                <path d="M 199 25 C 265 25 319 30 319 37 L 298 175 H 82 L 79 37 C 79 30 133 25 199 25 Z" fill="url(#edge-fade)"/>
            </mask>
        </defs>

        <g mask="url(#on-cup)">
            <g id="pattern-strip">
                <g id="pattern-set">
                    <use href="#isaac" x="-267"  y="60" width="100" height="100"/>
                    <use href="#bronze-horseman" x="-1021"  y="70" width="100" height="100"/>
                    <!-- if we add new symbols here we should
                    1. decrease its x coordinate by 754
                    2. increase translateX argument by 754 in @keyframes spin-pattern
                    3. increase animation time in #pattern-strip by 4s -->
                </g>
            </g>
        </g>

        <defs>
            <mask id="behind-cup">
                <rect x="0" y="0" width="380" height="300" fill="white"/>
                <path id="cup-silhouette" d="M 199 25 C 265 25 319 30 319 37 L 298 175 H 82 L 79 37 C 79 30 133 25 199 25 Z" fill="black"/>
            </mask>
        </defs>

        <g mask="url(#behind-cup)">
            <g id="handle-x">
                <g id="handle-y">
                    <path id="handle-edge" class="porcelain" d="M 0 17 C 5 22 3 87 2 99 S -1 111 -2 99 S -5 22 0 17 Z"/>
                    <g id="handle-shape">
                        <path id="handle" class="porcelain" d="M 42 125 C 41 121 48 118 51 122 C 65 136 70 118 61 112 C 40 97 0 99 0 61 C 0 -16 107 30 56 38 C 49 39 53 28 48 24 C 37 16 12 31 17 64 C 23 105 56 90 68 110 C 80 141 44 141 42 125 H 42 Z" />
                    </g>
                </g>
            </g>
        </g>

        <path id="mug-left-contour" class="porcelain"  d="M 50 35 C 66 50 73 71 74 93 C 75 117 71 139 85 154 C 107 177 144 193 146 230 C 160 194 142 163 110 143 C 100 137 89 125 86 98 C 83 59 72 58 50 35 H 50 Z" />
        <use href="#mug-left-contour" transform="translate(385) scale(-1 1)" />
        <path id="mug-rim" class="porcelain"  d="M 265 56 C 227 57 126 60 78 45 C 131 71 256 63 265 56 Z" />
        <path id="mug-cavity" class="porcelain"  d="M 199 25 C 265 25 319 30 319 37 C 319 43 265 48 199 48 C 133 48 79 43 79 37 C 79 30 133 25 199 25 Z" />
        <path id="mug-base" class="porcelain" d="M 239 249 C 220 256 135 256 132 233 C 131 226 113 247 122 249 C 178 267 249 253 258 249 C 264 247 252 234 250 241 S 243 248 239 249 Z" />
        <path id="saucer" class="porcelain"  d="M 97 225 C 50 230 9 238 9 254 C 9 271 71 292 195 292 C 309 292 371 271 371 254 C 371 238 330 230 283 225 C 308 226 376 229 376 258 C 376 276 304 300 195 300 C 76 300 4 276 4 258 C 4 229 74 226 97 225 H 97 Z" />
    </svg>
  </div>

  <div class="bar-track"><div class="bar-fill" id="fill"></div></div>
  <div class="percent" id="pct">0 %</div>
  <div class="done-msg" id="done">Чашечки загружены!</div>
</div>

<script>
  const fill = document.getElementById('fill');
  const pct  = document.getElementById('pct');
  const done = document.getElementById('done');
  const h1   = document.querySelector('h1');
  let progress = 0;

  const iv = setInterval(() => {
    progress += Math.random() * 3 + 0.5;
    if (progress >= 100) {
      progress = 100;
      clearInterval(iv);
      h1.textContent = 'Готово!';
      done.style.display = 'block';
    }
    fill.style.width = progress + '%';
    pct.textContent  = Math.floor(progress) + ' %';
  }, 200);
</script>
</body>
</html>
